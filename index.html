<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tree Testing อิ่มดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm research instrument — plain, honest, no decoration that could hint at answers.
   IDEA: a card index of the app's menu; you walk it with your finger.
   PICTURE: the menu tree itself, as large tappable rows under the task card.
   COLOUR and TYPE: white paper, ink #1f1a17, อิ่มดี chili red #e2492b for actions, green #2f8a55 only for "correct" in results; IBM Plex Sans Thai.
   LAYOUT: one 560px column, task card pinned on top, sticky action bar at the bottom. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#161413);--ink:light-dark(#1f1a17,#efe9e4);--mute:light-dark(#6f655e,#a99f98);--line:light-dark(#ece6e1,#2e2a27);--soft:light-dark(#f7f3f0,#211e1c);--red:#e2492b;--ok:light-dark(#2f8a55,#5cc488);--bad:light-dark(#c2412b,#f07c64)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Thai",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #2b6fd6;outline-offset:2px}
.pad{padding:20px 18px}
.brand{font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.brand b{color:var(--red)}
h1{font-size:34px;line-height:1.08;margin:18px 0 12px;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:28px 0 10px}
p{margin:0 0 12px}
.lead{font-size:17px}
.how{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.how li{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;gap:12px}
.how b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
.btn{height:52px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:600;font-size:16px;width:100%}
.btn[disabled]{opacity:.35;cursor:default}
.link{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:14px;padding:10px;min-height:44px}
.task{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.task small{color:var(--mute);font-size:13px;display:flex;justify-content:space-between}
.task p{font-size:18px;font-weight:600;line-height:1.4;margin:4px 0 0}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:12px 18px 4px;font-size:14px;color:var(--mute)}
.crumb button{border:0;background:var(--soft);border-radius:8px;padding:4px 10px;min-height:34px;font-size:14px}
.list{padding:4px 18px 18px;flex:1}
.node{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);text-align:left;margin-bottom:8px;font-size:17px}
.node span{flex:1}
.node svg{width:18px;height:18px;flex:none;color:var(--mute)}
.node.sel{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--bg))}
.up{color:var(--mute);font-size:15px;border-style:dashed}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:2px}
.sample{font-size:13px;color:var(--mute);background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0 16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:500}
td.n{text-align:right;white-space:nowrap}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.card h3{font-size:17px;margin:0 0 4px;line-height:1.35}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.kpi div{background:var(--soft);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--mute)}
.hb{margin:6px 0}
.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hb .t span:last-child{white-space:nowrap;color:var(--mute)}
.hb .tr{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:3px}
.hb .tr i{display:block;height:100%;background:#b9afa8;border-radius:5px}
.hb.c .tr i{background:var(--ok)}
.you{font-size:12px;font-weight:600;color:var(--red);margin-left:6px}
.lbl{font-size:13px;font-weight:600;margin-top:14px;color:var(--mute)}
.path{font-size:13px;color:var(--mute);margin-top:6px}
@media(prefers-reduced-motion:no-preference){.list{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateX(8px)}}}
</style>
</head>
<body>
<main id="app"></main>
<script>
{
const T={id:'root',n:'อิ่มดี',c:[
 {id:'home',n:'หน้าหลัก',c:[
  {id:'shops',n:'ร้านค้าทั้งหมด',c:[{id:'c_rice',n:'อาหารตามสั่ง'},{id:'c_noodle',n:'ก๋วยเตี๋ยว'},{id:'c_chicken',n:'ข้าวมันไก่'},{id:'c_drink',n:'เครื่องดื่ม'}]},
  {id:'promo',n:'โปรโมชันวันนี้'},{id:'search',n:'ค้นหาเมนู'}]},
 {id:'orders',n:'คำสั่งซื้อ',c:[
  {id:'active',n:'กำลังดำเนินการ'},
  {id:'hist',n:'ประวัติคำสั่งซื้อ',c:[{id:'hdetail',n:'รายละเอียดคำสั่งซื้อ'},{id:'reorder',n:'สั่งซ้ำ'}]},
  {id:'receipt',n:'ใบเสร็จ'}]},
 {id:'fav',n:'ร้านโปรด'},
 {id:'acct',n:'บัญชีของฉัน',c:[
  {id:'profile',n:'ข้อมูลส่วนตัว'},{id:'pay',n:'วิธีชำระเงิน'},
  {id:'perks',n:'สิทธิพิเศษ',c:[{id:'coupons',n:'คูปองของฉัน'},{id:'points',n:'แต้มสะสม'}]},
  {id:'settings',n:'การตั้งค่า',c:[{id:'notif',n:'การแจ้งเตือน'},{id:'lang',n:'ภาษา'},{id:'allergy',n:'ข้อมูลการแพ้อาหาร'}]}]},
 {id:'help',n:'ช่วยเหลือ',c:[{id:'faq',n:'คำถามที่พบบ่อย'},{id:'report',n:'แจ้งปัญหาคำสั่งซื้อ'},{id:'contact',n:'ติดต่อโรงอาหาร'},{id:'hours',n:'เวลาเปิด-ปิดร้าน'}]}]};
const IDX={},PAR={};
(function walk(n,p){IDX[n.id]=n;PAR[n.id]=p;(n.c||[]).forEach(k=>walk(k,n.id))})(T,null);
const pathOf=id=>{const a=[];while(id&&id!=='root'){a.unshift(IDX[id].n);id=PAR[id]}return a.join(' › ')};
// Sample results are simulated teaching data (n=30), not real participants.
const TASKS=[
 {q:'อาหารที่คุณสั่งไปเมื่อ 5 นาทีก่อน พร้อมให้ไปรับหรือยัง',ok:['active'],s:{succ:27,dir:25,first:{orders:28,home:2},dest:{active:27,hist:2,hdetail:1}}},
 {q:'คุณได้คูปองลด 10 บาทจากกิจกรรมคณะ อยากดูว่าคูปองใช้ได้ถึงวันไหน',ok:['coupons'],s:{succ:11,dir:7,first:{home:15,acct:12,orders:3},dest:{promo:13,coupons:11,pay:4,points:2}}},
 {q:'คุณได้ข้าวผัดมาแทนข้าวกะเพราที่สั่ง อยากแจ้งให้ร้านรู้',ok:['report','hdetail'],s:{succ:24,dir:19,first:{help:18,orders:11,acct:1},dest:{report:17,hdetail:7,contact:5,faq:1}}},
 {q:'คุณแพ้ถั่วลิสง อยากบันทึกไว้ให้ทุกร้านเห็นทุกครั้งที่สั่ง',ok:['allergy'],s:{succ:9,dir:6,first:{acct:24,help:3,home:3},dest:{profile:15,allergy:9,faq:3,search:3}}},
 {q:'อยากรู้ว่าร้านก๋วยเตี๋ยวลุงชัยปิดกี่โมง',ok:['hours'],s:{succ:8,dir:5,first:{home:20,help:10},dest:{c_noodle:18,hours:8,contact:4}}}
];
const N=30;
const app=document.getElementById('app');
let S;
const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
const reset=()=>{S={v:'intro',k:0,cur:'root',sel:null,log:[],path:[],back:false,t0:0};draw()};
function startTask(){S.cur='root';S.sel=null;S.path=[];S.back=false;S.t0=performance.now();S.v='task';draw();scrollTo(0,0)}
function draw(){app.innerHTML=V[S.v]()}
const V={
 intro:()=>`<div class="pad"><div class="brand"><span><b>อิ่มดี</b> v2 · ต้นแบบเมนูใหม่</span><span>INT120</span></div>
  <h1>Tree Testing: หาเมนูให้เจอ</h1>
  <p class="lead">คุณจะเห็นเมนูของแอปสั่งอาหาร <b>อิ่มดี</b> เป็นข้อความล้วน ไม่มีภาพหน้าจอ แล้วตอบว่าจะไปที่ไหนเพื่อทำแต่ละงาน</p>
  <ul class="how"><li><b>1</b><span>อ่านโจทย์ด้านบน แล้วแตะเมนูเพื่อเปิดดูข้างใน</span></li>
  <li><b>2</b><span>ถ้าเปิดผิดทาง ย้อนกลับได้เสมอ</span></li>
  <li><b>3</b><span>แตะเมนูที่คิดว่าใช่ แล้วกด <b>"ฉันจะหาที่นี่"</b></span></li></ul>
  <p>มีทั้งหมด 5 ข้อ ใช้เวลาประมาณ 3 นาที ไม่มีคำตอบผิด เรากำลังทดสอบ <b>เมนู</b> ไม่ใช่ทดสอบคุณ ตอบตามที่คิดจริงๆ ไม่ต้องเดา</p></div>
  <div class="bar"><button class="btn" data-a="start">เริ่มทดสอบ</button></div>`,
 task:()=>{const t=TASKS[S.k],node=IDX[S.cur];const crumbs=[];let id=S.cur;while(id){crumbs.unshift(id);id=PAR[id]}
  return `<div class="task"><small><span>ข้อ ${S.k+1} จาก ${TASKS.length}</span><span>Tree Testing · อิ่มดี</span></small><p>${t.q}</p></div>
  <div class="crumb">${crumbs.map((c,i)=>i<crumbs.length-1?`<button data-a="jump" data-v="${c}">${c==='root'?'เมนูหลัก':IDX[c].n}</button><span>›</span>`:`<span>${c==='root'?'เมนูหลัก':IDX[c].n}</span>`).join('')}</div>
  <div class="list">${S.cur!=='root'?`<button class="node up" data-a="jump" data-v="${PAR[S.cur]}"><span>‹ ย้อนกลับ</span></button>`:''}
   ${node.c.map(k=>`<button class="node${S.sel===k.id?' sel':''}" data-a="open" data-v="${k.id}"><span>${k.n}</span>${k.c?chev:''}</button>`).join('')}</div>
  <div class="bar"><button class="btn" data-a="pick" ${S.sel?'':'disabled'}>ฉันจะหาที่นี่${S.sel?`: ${IDX[S.sel].n}`:''}</button><button class="link" data-a="skip">ข้ามข้อนี้</button></div>`},
 done:()=>results()
};
function results(){
 const mine=S.log;
 const row=(l,i)=>`<tr><td>ข้อ ${i+1}</td><td>${l.skip?'<span class="bad">ข้าม</span>':l.ok?'<span class="ok">พบ</span>':'<span class="bad">ไม่พบ</span>'}</td><td>${l.skip?'–':l.direct?'ตรงทาง':'ย้อนกลับ'}</td><td class="n">${l.sec} วิ</td></tr>`;
 const hb=(label,v,c,you)=>`<div class="hb${c?' c':''}"><div class="t"><span>${label}${you?'<span class="you">คุณ</span>':''}</span><span>${v} คน · ${Math.round(v/N*100)}%</span></div><div class="tr"><i style="width:${v/N*100}%"></i></div></div>`;
 const cards=TASKS.map((t,i)=>{const s=t.s,m=mine[i];const dest=Object.entries(s.dest).sort((a,b)=>b[1]-a[1]);const first=Object.entries(s.first).sort((a,b)=>b[1]-a[1]);
  return `<div class="card"><h3>ข้อ ${i+1}: ${t.q}</h3>
   <div class="path">คำตอบที่ถูก: ${t.ok.map(pathOf).join(' หรือ ')}</div>
   <div class="kpi"><div><b>${Math.round(s.succ/N*100)}%</b><span>Success</span></div><div><b>${Math.round(s.dir/N*100)}%</b><span>Directness</span></div><div><b>${s.succ}/${N}</b><span>หาเจอ</span></div></div>
   <div class="lbl">คลิกแรกในเมนูหลัก (First click)</div>${first.map(([id,v])=>hb(IDX[id].n,v,false,m&&m.first===id)).join('')}
   <div class="lbl">ปลายทางที่เลือก (Destination)</div>${dest.map(([id,v])=>hb(pathOf(id),v,t.ok.includes(id),m&&m.dest===id)).join('')}
   ${m&&m.dest&&!s.dest[m.dest]?`<div class="path">คุณเลือก: ${pathOf(m.dest)}</div>`:''}
   ${m&&m.trail.length?`<div class="path">เส้นทางของคุณ: ${m.trail.map(id=>id==='root'?'เมนูหลัก':IDX[id].n).join(' → ')}</div>`:''}</div>`}).join('');
 return `<div class="pad"><div class="brand"><span><b>อิ่มดี</b> v2 · Tree Testing</span><span>INT120</span></div>
  <h1>ผลของคุณ</h1>
  <table><thead><tr><th>ข้อ</th><th>ผล</th><th>เส้นทาง</th><th style="text-align:right">เวลา</th></tr></thead><tbody>${mine.map(row).join('')}</tbody></table>
  <h2>เทียบกับผู้ทดสอบ 30 คน</h2>
  <p class="sample">ข้อมูลจำลองเพื่อการเรียน (สมมติว่ามีผู้ทดสอบ 30 คน) ใช้ฝึกอ่านผล Tree Testing ไม่ใช่ผลจริงของห้องเรียน แถบสีเขียวคือปลายทางที่ถูก ป้าย "คุณ" คือสิ่งที่คุณเลือก</p>
  ${cards}
  <p style="margin-top:20px"><b>Success</b> = สัดส่วนคนที่เลือกปลายทางถูก · <b>Directness</b> = สัดส่วนคนที่ไปถึงคำตอบโดยไม่ต้องย้อนกลับ · <b>First click</b> = เมนูแรกที่คนเลือก ถ้าคลิกแรกผิด มักหาไม่เจอ</p>
  <button class="link" data-a="again">ทำแบบทดสอบใหม่</button></div>`;
}
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='start'){S.log=[];S.k=0;startTask();return}
 if(a==='again'){reset();return}
 if(a==='open'){const n=IDX[v];S.path.push(v);if(n.c){S.cur=v;S.sel=null}else S.sel=v;draw();return}
 if(a==='jump'){S.back=true;S.path.push(v);S.cur=v;S.sel=null;draw();return}
 if(a==='pick'||a==='skip'){
  const t=TASKS[S.k],sec=Math.round((performance.now()-S.t0)/1000);
  const first=S.path.find(id=>PAR[id]==='root')||null;
  const dest=a==='pick'?S.sel:null;
  const trail=['root',...S.path];
  S.log.push({skip:a==='skip',dest,ok:!!dest&&t.ok.includes(dest),direct:!S.back,first,sec,trail:a==='pick'?trail:[]});
  S.k++;if(S.k<TASKS.length)startTask();else{S.v='done';draw();scrollTo(0,0)}
 }
});
reset();
}
</script>
</body>
</html>
